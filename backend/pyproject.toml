[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-assistant-harness-backend"
version = "0.1.0"
description = "Local-first personal assistant API and agent runtime"
requires-python = ">=3.12"
dependencies = [
  "openai-agents==0.17.2",
  # Later client schemas require cache_write_tokens, omitted by this Agents SDK.
  "openai==2.26.0",
  "fastapi==0.136.1",
  "uvicorn==0.47.0",
  "httpx==0.28.1",
  "cryptography==48.0.0",
  "playwright>=1.56.0,<2",
  "tzdata==2026.2",
]

[project.scripts]
harness-server = "harness.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
