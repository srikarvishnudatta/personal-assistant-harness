<!doctype html>
<html lang="en" data-astryx-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <script>
      (() => {
        let mode;
        try { mode = localStorage.getItem('harness-color-mode'); } catch {}
        if (mode !== 'light' && mode !== 'dark') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#141814' : '#fbfcf9';
      })();
    </script>
    <title>Personal Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
