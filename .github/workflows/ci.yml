name: Validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Switch to npm ci once a verified lockfile is committed.
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
